spring:
  application:
    name: StaySync


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hotel_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true



management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 8080
